# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
minversion = 4
envlist =
    flake8, mypy, pylint, black, tilescope
    py{311,312,313,314,315},
    pypy{311,312}

[default]
basepython=python3.15

[testenv]
description = run test
basepython =
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
    py315: python3.15
    pypy311: pypy3.11
    pypy312: pypy3.12
deps =
    pytest
    pytest-repeat
    pytest-timeout
    docutils
    Pygments
    # PyPy bundles cffi and HPy; virtualenv may omit their dependencies.
    pycparser; platform_python_implementation == "PyPy"
    setuptools; platform_python_implementation == "PyPy"
commands =
    python -m pip check
    python -m pip freeze
    python -m pytest {posargs}

[pytest]
addopts = --doctest-modules --doctest-ignore-import-errors
testpaths = tests comb_spec_searcher test_readme.txt example.py
markers = slow: marks tests as slow (deselect with '-m "not slow"')

[testenv:tilescope]
description = run tilescope test
basepython = {[default]basepython}
allowlist_externals=sh
deps =
    pytest
    pytest-timeout
    permuta @ git+https://github.com/PermutaTriangle/Permuta.git@develop
commands_pre =
    sh "{toxinidir}/setup_tilescope_test.sh" "{envtmpdir}/tilings"
commands =
    python -m pip check
    python -m pip freeze
    python -m pytest -c "{envtmpdir}/tilings/tox.ini" "{envtmpdir}/tilings/tests" {posargs}

[testenv:flake8]
description = run flake8 (linter)
basepython = {[default]basepython}
skip_install = True
deps =
    flake8
    flake8-isort
commands =
    flake8 --isort-show-traceback comb_spec_searcher tests example.py

[testenv:pylint]
description = run pylint (static code analysis)
basepython = {[default]basepython}
deps =
    pylint
commands = pylint comb_spec_searcher

[testenv:mypy]
description = run mypy (static type checker)
basepython = {[default]basepython}
deps =
    mypy
    types-requests
    types-tabulate
    typing_extensions>=4.12.0
commands =
    mypy

[testenv:black]
description = check that comply with autoformating
basepython = {[default]basepython}
skip_install = True
deps =
    black==25.12.0
commands = black --check --diff .
